#
# ansible role to install lmod:
#
---
- name: RedHat | trust GPG key for EPEL
  rpm_key:
    key: "{{ epel_key_url }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: RedHat | add epel repo
  become: yes
  yum:
    name: 
      - "{{ epel_package }}"
    state: present
  environment: "{{ proxy_env if proxy_env is defined else {} }}"
  when: ansible_os_family == "RedHat"

- name: "install packages"
  become: yes
  apt:
    update_cache: yes
    name:
    - bash
    - tcsh
    - lmod
    state: present
  when: ansible_os_family == "Debian"

- name: "install packages"
  become: yes
  dnf:
    name:
    - bash
    - tcsh
    - Lmod
    enablerepo: powertools
  when: ansible_os_family == "RedHat"

# kosmos: both paths are on NFS (/sw). When the server squashes root (kronos
# does since 2026-10-05), root on a client cannot create them; warn instead
# of failing the host. Lmod works without them (no modules to load).
- name: "mkdir software and module paths"
  become: yes
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ sm_software_path }}"
    - "{{ sm_module_path }}"
  register: lmod_sm_dirs
  failed_when:
    - lmod_sm_dirs.failed | default(false)
    - "'Permission denied' not in lmod_sm_dirs.msg | default('')"

- name: "report software and module paths that root cannot create"
  debug:
    msg: >-
      {{ item.item }} does not exist and root cannot create it (root squashed
      on the NFS server); create it on the server. Lmod finds no modules there
      until then.
  loop: "{{ lmod_sm_dirs.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'Permission denied' in item.msg | default('')"

- name: "configure sh profile"
  become: yes
  template:
    src: templates/z00_lmod.sh
    dest: /etc/profile.d
    owner: root
    group: root
    mode: 0755
  tags:
    - configuration

- name: "configure csh profile"
  become: yes
  template:
    src: templates/z00_lmod.csh
    dest: /etc/profile.d
    owner: root
    group: root
    mode: 0755
  tags:
    - configuration

- name: "unset previous lmod setup"
  shell: unset MODULEPATH_ROOT  # noqa command-instead-of-shell
  register: unset_lmod_bash
  args:
    executable: /bin/bash
  changed_when: unset_lmod_bash.rc != 0

- name: "unset previous lmod setup"
  shell: unsetenv MODULEPATH_ROOT  # noqa command-instead-of-shell
  register: unset_lmod_csh
  args:
    executable: /bin/csh
  changed_when: unset_lmod_csh.rc != 0

- name: "auto load lmod"
  shell: . /etc/profile.d/z00_lmod.sh  # noqa command-instead-of-shell
  register: load_lmod_bash
  args:
    executable: /bin/bash
  changed_when: load_lmod_bash.rc != 0

- name: "auto load lmod "
  shell: source /etc/profile.d/z00_lmod.csh  # noqa command-instead-of-shell
  register: load_lmod_csh
  args:
    executable: /bin/csh
  changed_when: load_lmod_csh.rc != 0
