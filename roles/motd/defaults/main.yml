---
motd_header_template: "00-header.yml.j2"

# kosmos: fast shell replacement for Ubuntu's landscape-sysinfo, from
# roles/motd/files/. The 50- prefix keeps the run-parts order unchanged.
motd_sysinfo_file: "50-sysinfo"

# Scripts in /etc/update-motd.d that keep their execute bit, besides the two
# the role installs. Everything else there is set to mode 0000.
motd_keep_executable:
  - 91-contract-ua-esm-status
