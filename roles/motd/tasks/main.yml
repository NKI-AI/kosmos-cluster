#
# ansible role to setup motd prompt
#
---
- name: disable current motd
  become: yes
  command: find /etc/update-motd.d -type f -exec chmod 0000 {} \;
  tags: motd


- name: install motd header
  template:
    src: "{{ motd_header_template }}"
    dest: /etc/update-motd.d/00-header
    owner: root
    group: root
    mode: 0755

