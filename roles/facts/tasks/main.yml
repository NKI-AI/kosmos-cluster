---
- name: apt install pciutils
  apt: name=pciutils update_cache=yes
  when: ansible_os_family == 'Debian'
  environment: "{{ proxy_env if proxy_env is defined else {} }}"

- name: yum install pciutils
  yum: name=pciutils update_cache=yes
  when: ansible_os_family == 'RedHat'
  environment: "{{ proxy_env if proxy_env is defined else {} }}"

- name: create fact directory
  file:
    path: /etc/ansible/facts.d
    state: directory
    mode: 0755

- name: custom facts
  copy:
    src: "{{ item }}"
    dest: /etc/ansible/facts.d/
    mode: 0755
  with_fileglob:
    - '*'

# Explicit setup ignores ansible_gather_subset; !all/!min skips gaia's
# mount collector. Reload ansible_local after copying facts.d.
- name: regather local facts
  setup:
    gather_subset:
      - "!all"
      - "!min"
      - local
    filter:
      - ansible_local
