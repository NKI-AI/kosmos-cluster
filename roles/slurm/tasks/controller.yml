---

- name: install dependencies
  apt:
    name: "{{ item }}"
    state: present
  with_items:
    - mariadb-server
    - python3-mysqldb
    - s-nail
    - ssmtp
  when: ansible_os_family == "Debian"

- name: install dependencies
  dnf:
    name: "{{ item }}"
    state: present
  with_items:
    - mariadb-server
    - python3-PyMySQL
    - mailx
    - policycoreutils-python-utils
  when: ansible_os_family == "RedHat"

- name: Allow mysql to read libaio.so.1
  sefcontext:
    target: '/lib64(/.*)?'
    setype: mysqld_db_t
    state: present
  when: 
  - ansible_os_family == "RedHat"
  - (ansible_selinux is defined) and (ansible_selinux.status != "disabled")

- name: Apply new SELinux file context to filesystem
  command: restorecon -irv /lib64
  when: 
  - ansible_os_family == "RedHat"
  - (ansible_selinux is defined) and (ansible_selinux.status != "disabled")

- name: start mariadb
  systemd:
    name: mariadb
    state: started
    enabled: yes
    daemon-reload: yes
  when: ansible_os_family == "RedHat"

# kosmos: SchedMD's MariaDB settings for slurmdbd
# (https://slurm.schedmd.com/accounting.html), applied before slurmdbd first
# creates its tables. Memory from /proc/meminfo: implicit fact gathering is
# the min subset, which has no memory facts.
- name: read total memory (MB) for the InnoDB buffer pool
  command: awk '/^MemTotal:/ { print int($2 / 1024) }' /proc/meminfo
  register: slurm_mariadb_memtotal
  changed_when: false
  check_mode: false
  when:
  - ansible_os_family == "Debian"
  - slurm_mariadb_tune | bool

- name: write the MariaDB tuning drop-in for slurmdbd
  vars:
    buffer_pool_mb: "{{ slurm_mariadb_buffer_pool_mb | default([(slurm_mariadb_memtotal.stdout | int * 0.25) | int, 4096] | min) }}"
  copy:
    dest: /etc/mysql/mariadb.conf.d/99-slurmdbd.cnf
    mode: "0644"
    content: |
      # Managed by Ansible (roles/slurm/tasks/controller.yml, kosmos).
      # SchedMD recommendations for slurmdbd, https://slurm.schedmd.com/accounting.html
      [mysqld]
      innodb_buffer_pool_size = {{ buffer_pool_mb }}M
      innodb_log_file_size = {{ (buffer_pool_mb | int / 4) | int }}M
      innodb_lock_wait_timeout = {{ slurm_mariadb_lock_wait_timeout }}
      max_allowed_packet = {{ slurm_mariadb_max_allowed_packet }}

      [mariadbd]
      # slurmdbd cannot recover from the rollbacks this causes (MariaDB >= 10.6.18;
      # loose- so older servers ignore the unknown option).
      loose-innodb_snapshot_isolation = OFF
  register: slurm_mariadb_dropin
  when:
  - ansible_os_family == "Debian"
  - slurm_mariadb_tune | bool

- name: restart mariadb to apply the tuning
  systemd:
    name: mariadb
    state: restarted
    enabled: yes
  when: slurm_mariadb_dropin is changed

- name: setup slurm db user
  mysql_user:
    name: "{{ slurm_db_username }}"
    password: "{{ slurm_db_password }}"
    host: localhost
    priv: "*.*:USAGE/slurm_acct_db.*:ALL"
    state: present

- name: create slurm directories
  file:
    path: "{{ item }}"
    state: directory
    owner: slurm
    mode: 0755
  with_items:
    - "{{ slurm_config_dir }}"
    - /var/spool/slurm/ctld
    - /var/log/slurm

- name: create slurm directories for nfs sharing
  file:
    path: "{{ item }}"
    state: directory
    owner: slurm
    mode: 0755
  with_items:
    - "{{ slurmctl_config_dir }}"
  when: slurm_conf_symlink

- name: create slurm HA directory
  file:
    path: "{{ slurm_ha_state_save_location }}"
    state: directory
    owner: slurm
    mode: 0755
  when: slurm_enable_ha

- name: configure slurm.conf
  template:
    src: "{{ slurm_conf_template }}"
    dest: "{{ slurm_config_dir }}/slurm.conf"
    mode: "0644"
  when: not slurm_conf_symlink
  notify:
  - restart slurmctld
  tags:
  - config

# kosmos: the NFS server may squash root (kronos does since 2026-10-05), so
# root cannot write slurmctl_config_dir. Render the file on local disk, then
# put it in place as the slurm user, who owns the directory. runuser from
# root needs no sudo rule for the slurm user; cp + mv replaces the file in
# one step, so readers (pam_slurm_adopt at every ssh login) never see it
# missing. slurm.conf.shared is the last deployed copy, and --check --diff
# compares against it.
- name: render slurm.conf for nfs
  template:
    src: "{{ slurm_conf_template }}"
    dest: "{{ slurm_config_dir }}/slurm.conf.shared"
    mode: "0644"
  register: slurm_conf_rendered
  when: slurm_conf_symlink
  notify:
  - restart slurmctld
  tags:
  - config

- name: read the checksums of the rendered and the shared slurm.conf
  stat:
    path: "{{ item }}"
    get_checksum: true
  loop:
    - "{{ slurm_config_dir }}/slurm.conf.shared"
    - "{{ slurmctl_config_dir }}/slurm.conf"
  register: slurm_conf_checksums
  when: slurm_conf_symlink
  tags:
  - config

- name: configure slurm.conf to nfs
  command: >-
    runuser -u {{ slurm_username }} -- sh -c
    'cp "$1" "$2.new" && chmod 0644 "$2.new" && mv -f "$2.new" "$2"' sh
    {{ slurm_config_dir }}/slurm.conf.shared {{ slurmctl_config_dir }}/slurm.conf
  changed_when: true
  when:
    - slurm_conf_symlink
    - not ansible_check_mode
    - (slurm_conf_checksums.results | map(attribute='stat.checksum', default='') | unique | length) > 1
  notify:
  - restart slurmctld
  tags:
  - config

- name: complete slurm.conf
  file:
    path: "{{ slurm_config_dir }}/slurm.conf"
    state: link
    src: "{{ slurmctl_config_dir }}/slurm.conf"
    force: yes
  when: slurm_conf_symlink
  notify:
  - restart slurmctld
  tags:
  - config

- name: configure slurmdbd.conf
  template:
    src: "{{ slurm_dbd_conf_template }}"
    dest: "{{ slurm_config_dir }}/slurmdbd.conf"
    owner: "{{ slurm_username }}"
    mode: 0600
  # kosmos: StoragePass is slurm_db_password; keep it out of --diff
  diff: false
  notify:
  - restart slurmdbd
  tags:
  - config

- name: restart slurmdbd
  systemd:
    name: slurmdbd
    state: restarted
    enabled: yes
    daemon-reload: yes

- name: wait for slurmdbd to be available
  wait_for:
    port: 6819
    delay: 5

- name: create cluster
  command: sacctmgr -i add cluster {{ slurm_cluster_name }}
  register: create_cluster_result
  failed_when: "create_cluster_result.rc != 0 and 'already exists' not in create_cluster_result.stdout"
  changed_when: "'already exists' not in create_cluster_result.stdout"
  environment:
    PATH: '{{ slurm_install_prefix }}/bin:{{ ansible_env.PATH }}'
  run_once: true

- name: create accounts
  command: >-
    sacctmgr -i add account {{ item }}
    Description="{{ item }}"
  register: create_account_result
  failed_when: >
    create_account_result.rc != 0 and
    'Nothing new added' not in create_account_result.stdout and
    'Nothing added' not in create_account_result.stdout and
    'Already existing' not in create_account_result.stdout
  changed_when: >
    'Nothing new added' not in create_account_result.stdout and
    'Nothing added' not in create_account_result.stdout and
    'Already existing' not in create_account_result.stdout
  loop: "{{ slurm_accounts_managed }}"
  run_once: true
  environment:
    PATH: '{{ slurm_install_prefix }}/bin:{{ ansible_env.PATH }}'

# kosmos: QOS from site config (slurm_qos), created before users/associations
# and before slurmctld starts: partitions list them in AllowQos and
# AccountingStorageEnforce includes qos. Their limits are set after slurmctld
# has started (end of this file).
- name: every QOS a partition allows is defined in slurm_qos
  vars:
    allowed_qos: >-
      {{ partition_settings | default({}) | dict2items
         | map(attribute='value.slurm_allow_qos') | select('defined')
         | map('split', ',') | flatten | unique }}
  assert:
    that: allowed_qos | difference(slurm_qos | default({}) | list) | length == 0
    fail_msg: "QOS in AllowQos but not in slurm_qos: {{ allowed_qos | difference(slurm_qos | default({}) | list) | join(', ') }}"
    quiet: true
  run_once: true

- name: create QOS
  command: sacctmgr -i add qos {{ item.key }}
  loop: "{{ slurm_qos | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: create_qos_result
  failed_when: >
    create_qos_result.rc != 0 and
    'Nothing new added' not in create_qos_result.stdout and
    'Nothing added' not in create_qos_result.stdout and
    'Already existing' not in create_qos_result.stdout
  changed_when: >
    'Nothing new added' not in create_qos_result.stdout and
    'Nothing added' not in create_qos_result.stdout and
    'Already existing' not in create_qos_result.stdout
  run_once: true
  environment:
    PATH: '{{ slurm_install_prefix }}/bin:{{ ansible_env.PATH }}'

- name: create users
  command: sacctmgr -i create user {{ item }} account={{ slurm_admin_account }} adminlevel=None
  register: create_user_result
  failed_when: >
    create_user_result.rc != 0 and
    'Nothing new added' not in create_user_result.stdout and
    'Nothing added' not in create_user_result.stdout and
    'Already existing' not in create_user_result.stdout
  changed_when: >
    'Nothing new added' not in create_user_result.stdout and
    'Nothing added' not in create_user_result.stdout and
    'Already existing' not in create_user_result.stdout
  with_items:
    - "{{ user }}"
  environment:
    PATH: '{{ slurm_install_prefix }}/bin:{{ ansible_env.PATH }}'

- name: clear slurm state when downgrading
  command: slurmctld -i
  when: slurm_downgrade
  environment:
    PATH: '{{ slurm_install_prefix }}/bin:{{ ansible_env.PATH }}'

- name: wait for slurmctld to start
  pause:
    seconds: 20
  when: slurm_downgrade

- name: kill slurmctld
  command: killall slurmctld
  failed_when: false
  when: slurm_downgrade

- name: restart slurmctld
  systemd:
    name: slurmctld
    state: restarted
    enabled: yes
    daemon-reload: yes

# kosmos: QOS limits (slurm_qos). A new accounting database knows only the
# built-in TRES; gres/gpu is added when slurmctld first starts with
# AccountingStorageTRES=gres/gpu, and sacctmgr rejects a gres/gpu limit before
# that. So wait for it after the restart above. Not in check mode: the
# command does not run there, so the wait would always time out.
- name: wait until slurmctld has registered the gres/gpu TRES
  command: sacctmgr -nP show tres where type=gres name=gpu format=Type,Name
  register: slurm_gpu_tres
  until: "'gres|gpu' in slurm_gpu_tres.stdout"
  retries: 30
  delay: 5
  changed_when: false
  run_once: true
  when: slurm_manage_gpus | bool and not ansible_check_mode
  environment:
    PATH: '{{ slurm_install_prefix }}/bin:{{ ansible_env.PATH }}'

# Reapplied every run; does not change user-level MaxJobsAccrue.
- name: set MaxJobsAccrue on managed accounts
  command: >-
    sacctmgr -i modify account {{ item }} set
    MaxJobsAccrue={{ slurm_max_jobs_accrue }}
  loop: "{{ slurm_accounts_managed }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  run_once: true
  when: slurm_max_jobs_accrue is defined
  environment:
    PATH: '{{ slurm_install_prefix }}/bin:{{ ansible_env.PATH }}'

# sacctmgr prints "Modified qos" whenever the name matches, also when nothing
# changed, so this cannot report changes: it reapplies the limits every run.
# A limit taken out of slurm_qos is not cleared (set it to -1 instead).
- name: set QOS limits
  command: >-
    sacctmgr -i modify qos where name={{ item.key }} set
    {% for k, v in item.value.items() %}{{ k }}={{ v }} {% endfor %}
  loop: "{{ slurm_qos | default({}) | dict2items | selectattr('value') | list }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  run_once: true
  environment:
    PATH: '{{ slurm_install_prefix }}/bin:{{ ansible_env.PATH }}'
