ConstrainCores=yes
ConstrainDevices=yes
ConstrainRAMSpace=yes
# kosmos: no swap for jobs. Without these a job over its --mem swaps on nodes
# that have swap (gaia, herakles: /swap.img) and finishes COMPLETED; with them
# cgroup/v2 sets memory.swap.max=0 and the job is OOM-killed at --mem.
ConstrainSwapSpace=yes
AllowedSwapSpace=0
#TaskAffinity=yes
