{# kosmos: slurm_gres_autodetect (site config) selects a detection mechanism
   without NVML, e.g. "nvidia"; see docs/kosmos/gpu-inventory.md. #}
{% set gres_autodetect = 'nvml' if slurm_autodetect_nvml else (slurm_gres_autodetect | default('')) -%}
{% if gres_autodetect -%}
AutoDetect={{ gres_autodetect }}
{% else -%}
{% set cpu_topology = ansible_local["topology"]["cpu_topology"] -%}
{% set gpu_topology = ansible_local["topology"]["gpu_topology"] -%}
{% for affinity in gpu_topology %}
Name=gpu File=/dev/nvidia{{ loop.index0 }} Cores={{ affinity }}
{% endfor %}
{% endif -%}
