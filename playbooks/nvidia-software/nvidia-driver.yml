---
- hosts: "{{ hostlist | default('all') }}"
  become: true
  tags:
  - nvidia
  - nvidia_driver
  tasks:
    - name: Check for DGX packages
      stat:
        path: /etc/dgx-release
      register: is_dgx

    - name: install custom facts
      include_role:
        name: facts

    # kosmos: refuse GPUs the configured branch or kernel module flavour cannot
    # drive (config/group_vars/all.yml, docs/kosmos/gpu-inventory.md).
    - name: check that the driver branch supports this node's GPUs
      assert:
        that:
          - _gpu_unknown_ids | length == 0
          - not (_gpu_legacy | length > 0 and (_gpu_branch | int > 580 or _gpu_open_modules | bool))
        fail_msg: >-
          {{ inventory_hostname }}: GPU IDs {{ ansible_local['gpus']['pci_ids'] | default([]) }}.
          {% if _gpu_unknown_ids %}Not in nvidia_gpu_architectures: {{ _gpu_unknown_ids }}; look the model up and add it.{% endif %}
          {% if _gpu_legacy %}Architecture {{ _gpu_legacy | unique }} needs branch 580 or older without open kernel modules
          (configured: {{ _gpu_branch }}, open modules {{ _gpu_open_modules }}).{% endif %}
      vars:
        _gpu_ids: "{{ ansible_local['gpus']['pci_ids'] | default([]) }}"
        _gpu_unknown_ids: "{{ _gpu_ids | reject('in', nvidia_gpu_architectures) | list }}"
        _gpu_legacy: >-
          {{ _gpu_ids | select('in', nvidia_gpu_architectures) | map('extract', nvidia_gpu_architectures)
             | select('in', nvidia_gpu_legacy_architectures | default([])) | list }}
        _gpu_branch: "{{ nvidia_driver_ubuntu_branch | default(nvidia_driver_branch) }}"
        _gpu_open_modules: "{{ nvidia_driver_ubuntu_use_open_kernel_modules | default(false) }}"
      when:
        - nvidia_gpu_architectures is defined
        - ansible_local['gpus']['count']
        - is_dgx.stat.exists == False

    - name: configure Ubuntu NVIDIA driver packages
      include_tasks: tasks/nvidia-driver-ubuntu-packages.yml
      when: ansible_distribution == 'Ubuntu'

    # kosmos: keep unattended-upgrades away from the driver packages
    # (nvidia_driver_unattended_upgrades_blacklist, config/group_vars/all.yml).
    # Written before the install so no automatic upgrade can slip in between.
    - name: exclude NVIDIA driver packages from unattended-upgrades
      copy:
        dest: /etc/apt/apt.conf.d/52kosmos-nvidia-unattended-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          // Managed by Ansible (playbooks/nvidia-software/nvidia-driver.yml).
          // Upgrade the NVIDIA driver by hand, with a reboot.
          Unattended-Upgrade::Package-Blacklist {
          {% for pkg in nvidia_driver_unattended_upgrades_blacklist %}
              "{{ pkg }}";
          {% endfor %}
          };
      when:
        - ansible_distribution == 'Ubuntu'
        - nvidia_driver_unattended_upgrades_blacklist | default([]) | length > 0
        - (ansible_local['gpus']['count'] and is_dgx.stat.exists == False) or (nvidia_driver_force_install|default(false))

    - name: remove the unattended-upgrades exclusion when none is configured
      file:
        path: /etc/apt/apt.conf.d/52kosmos-nvidia-unattended-upgrades
        state: absent
      when:
        - ansible_distribution == 'Ubuntu'
        - nvidia_driver_unattended_upgrades_blacklist | default([]) | length == 0

    - name: install nvidia driver
      include_role:
        name: nvidia.nvidia_driver
      when: (ansible_local['gpus']['count'] and is_dgx.stat.exists == False) or (nvidia_driver_force_install|default(false))

    - name: install NVSwitch fabric manager
      include_tasks: tasks/nvidia-fabricmanager.yml
      vars:
        _nvidia_fm_branch: "{{ nvidia_driver_ubuntu_branch | default(nvidia_driver_branch) }}"
        _nvidia_fm_suffix: "{{ nvidia_driver_ubuntu_packages_suffix | default('-server') }}"
      when:
        - ansible_distribution == 'Ubuntu'
        - ansible_local['gpus']['nvswitch_count'] | default(0) | int > 0
        - is_dgx.stat.exists == False
        - nvidia_driver_package_state | default('present') != 'absent'

    - name: test nvidia-smi
      command: nvidia-smi
      changed_when: false
      when:
        - ansible_local['gpus']['count']
        - is_dgx.stat.exists == False
  environment: "{{proxy_env if proxy_env is defined else{}}}"
